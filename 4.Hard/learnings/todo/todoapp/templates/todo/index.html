{% extends "base.html" %}
{% block content %}
<h1>All Todos</h1>

<a href="{% url "create_todo" %}">Add Todo</a>
<table class="table">
    <thead>
        <tr>
            <th>SN</th>
            <th>Title</th>
            <th>Description</th>
            <th>Created at</th>
            <th>Actions</th>
        </tr>
    </thead>

    <tbody>
            {% for todo in todos %}
                <tr>
                    <td>{{forloop.counter}}</td>
                    <td><a style="text-decoration: none; color: #000" href="{% url "todo_details" todo.pk %}">{{todo.title|truncatechars:50}}</a></td>
                    <td>{{todo.description|truncatechars:50}}</td>
                    <td>{{todo.created_at}}</td>
                    <td>
                        <a href="{% url "todo_update" todo.pk %}" class="btn btn-sm btn-warning">Edit</a>
                        <a href="{% url "todo_delete" todo.pk %}" class="btn btn-sm btn-danger">Delete</a>
                    </td>
                </tr>
            {% endfor %}        
    </tbody>
</table>
{% endblock content %}
